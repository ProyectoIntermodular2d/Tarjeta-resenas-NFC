<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Negocio</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#4f46e5;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{background:#fff;color:#1b1f2a;border-radius:22px;padding:28px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px #0003}
.logo{font-size:3rem}h1{font-size:1.4rem;margin:6px 0}p{color:#667085;margin:6px 0 16px}
.stars button{background:none;border:0;font-size:2.4rem;cursor:pointer;color:#d0d5dd;padding:2px}
.stars button.on{color:#f5b301}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:#4f46e5;color:#fff;font:600 1rem system-ui;cursor:pointer;text-decoration:none;margin-top:10px;box-sizing:border-box}
textarea{width:100%;height:100px;border:1px solid #d0d5dd;border-radius:10px;padding:10px;font:inherit;box-sizing:border-box}
.hide{display:none}
</style></head><body><div class="box">
<div class="logo">☕</div><h1>Mi Negocio</h1><p id="m">¿Qué tal fue tu experiencia?</p>
<div class="stars" id="s"></div>
<div id="good" class="hide"><p>¡Gracias! Compartir tu opinión nos ayuda muchísimo.</p><a class="btn" id="g" target="_blank" rel="noopener">Dejar mi reseña</a></div>
<div id="bad" class="hide"><p>Lamentamos que no fuera perfecto. Cuéntanos qué podemos mejorar:</p><textarea id="t" placeholder="Tu comentario…"></textarea><a class="btn" id="w" target="_blank" rel="noopener">Enviar comentario</a></div>
</div>
<script>
const C={"link":"","min":4,"wa":"","name":"Mi Negocio"};let n=0;const s=document.getElementById('s');
for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.setAttribute('aria-label',i+' estrellas');b.onclick=()=>pick(i);s.appendChild(b)}
function pick(i){n=i;[...s.children].forEach((b,k)=>b.className=k<i?'on':'');
 const ok=i>=C.min;document.getElementById('good').className=ok?'':'hide';document.getElementById('bad').className=ok?'hide':'';
 if(ok)document.getElementById('g').href=C.link||'#';else upd()}
function upd(){const t=document.getElementById('t').value;const m=encodeURIComponent('Opinión ('+n+'★) sobre '+C.name+': '+t);
 document.getElementById('w').href=C.wa?'https://wa.me/'+C.wa+'?text='+m:'#'}
document.getElementById('t').oninput=upd;
</script></body></html>
